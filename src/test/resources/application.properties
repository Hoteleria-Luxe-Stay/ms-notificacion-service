spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.mail.host=localhost
spring.mail.port=25

klab.mail.from-email=test@example.com
klab.mail.from-name=Test
klab.mail.smtp.host=localhost
klab.mail.smtp.port=25
klab.mail.smtp.auth=false

app.support.email=support@example.com
app.rabbitmq.contacto.queue=test-contacto-queue
app.notifications.sesion.enabled=true
app.notifications.reserva.enabled=true
app.kafka.topics.reserva-notifications=test-topic

spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.cloud.config.import-check.enabled=false
